<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Cricket ball">
<!--
  Cricket ball for the hero's closing composition.

  This comment sits *inside* the root element on purpose. libvips sniffs only
  the first kilobyte or so of a file for the `<svg` marker, so a leading comment
  this long pushed the root tag out of range and sharp rejected the file as an
  unsupported format — while browsers loaded it fine. Keep the open tag first.

  Drawn rather than photographed: there is no ball asset in the project, and an
  invented photograph beside a real product render mismatches in lighting badly
  enough to read at a glance. A drawing is honestly a drawing — it takes its key
  light from the same upper-left direction as the bat and stays a prop.

  Deliberately dark and low-contrast. A bright, glossy ball renders as plastic
  and, worse, competes with the bat; the brief puts the product first and the
  reference frames the ball as a form half-lost in the warm gloom at the toe.
  So there is no hard specular dot and no polished equatorial band — an ellipse
  across the middle draws a visible straight edge and instantly flattens the
  sphere. What sells it instead: the limb darkens with a terminator partway, and
  the seam is a raised ridge (dark groove, lit crest) that the stitches *cross*.
  Stitches placed beside a seam read as dashes; crossing them makes it a seam.

  Viewed slightly above centre and turned a little right, matching the hero
  camera in the final composition.
-->
  <defs>
    <!-- Key light upper-left. The 62% stop is the terminator; without it the
         sphere flattens to a disc. Top value stays well below full red so the
         ball reads as leather in shadow rather than as a lit studio subject. -->
    <radialGradient id="leather" cx="33%" cy="26%" r="78%">
      <stop offset="0%"   stop-color="#8f322a"/>
      <stop offset="28%"  stop-color="#71201d"/>
      <stop offset="62%"  stop-color="#4a0f13"/>
      <stop offset="86%"  stop-color="#26060a"/>
      <stop offset="100%" stop-color="#140305"/>
    </radialGradient>

    <!-- Bounce light along the lower-right limb, off the implied floor. Keeps
         the dark side from going dead flat. -->
    <radialGradient id="bounce" cx="68%" cy="78%" r="42%">
      <stop offset="0%"   stop-color="#7d2a22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7d2a22" stop-opacity="0"/>
    </radialGradient>

    <!-- Broad, dim sheen instead of a specular dot. Lacquer on a ball this dark
         scatters; a hard white point would read as a sticker stuck to it. -->
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffcdbe" stop-opacity="0.2"/>
      <stop offset="60%"  stop-color="#ffcdbe" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffcdbe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="drop" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Clips the seam to the sphere so stitching cannot spill past the limb. -->
    <clipPath id="ball">
      <circle cx="120" cy="116" r="96"/>
    </clipPath>
  </defs>

  <!-- Contact shadow: wide, soft, under the ball rather than offset behind it,
       because the hero's key light is high. -->
  <ellipse cx="122" cy="214" rx="84" ry="14" fill="url(#drop)"/>

  <circle cx="120" cy="116" r="96" fill="url(#leather)"/>
  <circle cx="120" cy="116" r="96" fill="url(#bounce)"/>

  <g clip-path="url(#ball)">
    <!-- Seam ridge, three strokes on one arc: a soft groove, a lit crest nudged
         left toward the key light, and a fine dark core. Relief, not an outline.
         The arc bulges only to x 164 — a wider bulge turns the seam into a
         circle drawn on the surface rather than a band wrapping round it. -->
    <path d="M141 21 C 167 59, 167 173, 141 211" fill="none" stroke="#1b0407" stroke-opacity="0.42" stroke-width="9"/>
    <path d="M138 21 C 164 59, 164 173, 138 211" fill="none" stroke="#a24a3f" stroke-opacity="0.2"  stroke-width="2.5"/>
    <path d="M141 21 C 167 59, 167 173, 141 211" fill="none" stroke="#150305" stroke-opacity="0.34" stroke-width="1.8"/>

    <!-- Stitches. Short horizontal segments centred on the seam, each rotated
         about its own midpoint so it crosses the ridge at a consistent lean —
         the herringbone a six-row seam shows at distance. Lengths vary by a
         pixel or two: a uniform run reads as machine teeth. Opacity falls off
         toward both limbs where the surface turns away. -->
    <g stroke="#c9b9a2" stroke-linecap="round" stroke-width="2.6" fill="none">
      <path d="M138 40 L156 40"   stroke-opacity="0.1"  transform="rotate(-19 147 40)"/>
      <path d="M141 53 L161 53"   stroke-opacity="0.18" transform="rotate(-21 151 53)"/>
      <path d="M145 66 L163 66"   stroke-opacity="0.25" transform="rotate(-19 154 66)"/>
      <path d="M147 79 L167 79"   stroke-opacity="0.31" transform="rotate(-20 157 79)"/>
      <path d="M150 92 L168 92"   stroke-opacity="0.35" transform="rotate(-18 159 92)"/>
      <path d="M150 105 L170 105" stroke-opacity="0.37" transform="rotate(-20 160 105)"/>
      <path d="M151 118 L169 118" stroke-opacity="0.37" transform="rotate(-19 160 118)"/>
      <path d="M149 131 L169 131" stroke-opacity="0.35" transform="rotate(-21 159 131)"/>
      <path d="M149 144 L167 144" stroke-opacity="0.3"  transform="rotate(-19 158 144)"/>
      <path d="M146 157 L166 157" stroke-opacity="0.25" transform="rotate(-20 156 157)"/>
      <path d="M144 170 L162 170" stroke-opacity="0.18" transform="rotate(-19 153 170)"/>
      <path d="M140 183 L160 183" stroke-opacity="0.12" transform="rotate(-21 150 183)"/>
      <path d="M136 196 L154 196" stroke-opacity="0.06" transform="rotate(-19 145 196)"/>
    </g>

    <!-- Sheen last, over the seam: light falls on the stitching too, so leaving
         the seam untouched here is what would look pasted on. Offset up-left,
         well inside the limb. -->
    <ellipse cx="88" cy="76" rx="52" ry="42" fill="url(#sheen)" transform="rotate(-26 88 76)"/>
  </g>

  <!-- Limb darkening as a ring, after everything, so the seam falls off at the
       edge too and the sphere stays closed. -->
  <circle cx="120" cy="116" r="96" fill="none" stroke="#130305" stroke-opacity="0.5" stroke-width="12"/>
</svg>
