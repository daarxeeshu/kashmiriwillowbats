  Replace this file with the real photograph at the same path.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="halo" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#e8d4a8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e8d4a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
