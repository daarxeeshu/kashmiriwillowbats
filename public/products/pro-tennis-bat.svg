<!--
  PLACEHOLDER — awaiting real product photography.
  Same construction as regular-bat.svg with a blank sticker band on the upper blade,
  which is only there to distinguish this card from its three neighbours while the
  layout is reviewed. Replace with the real photograph at the same path.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="halo" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#e8d4a8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e8d4a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b08f55"/>
      <stop offset="42%" stop-color="#f0dfb8"/>
      <stop offset="70%" stop-color="#cdae7c"/>
      <stop offset="100%" stop-color="#95753f"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241a0e"/>
      <stop offset="45%" stop-color="#4a3620"/>
      <stop offset="100%" stop-color="#1d1509"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="520" rx="215" ry="400" fill="url(#halo)"/>

  <rect x="376" y="92" width="48" height="236" rx="24" fill="url(#grip)"/>
  <g stroke="#000" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round">
    <line x1="382" y1="142" x2="418" y2="142"/>
    <line x1="382" y1="182" x2="418" y2="182"/>
    <line x1="382" y1="222" x2="418" y2="222"/>
    <line x1="382" y1="262" x2="418" y2="262"/>
  </g>

  <!-- slimmer blade than the other three -->
  <path d="M422 322 Q446 342 450 404 C455 542 453 700 444 818 Q400 852 356 818 C347 700 345 542 350 404 Q354 342 378 322 Z"
        fill="url(#wood)"/>
  <path d="M350 404 C345 542 347 700 356 818 Q372 830 386 834 C376 700 374 542 378 400 Z"
        fill="#000" fill-opacity="0.1"/>
  <path d="M450 404 C455 542 453 700 444 818 Q428 830 414 834 C424 700 426 542 422 400 Z"
        fill="#000" fill-opacity="0.16"/>

  <!-- blank sticker band, left unlettered: a name printed here would be inventing
       artwork for a product whose photograph has not arrived -->
  <rect x="352" y="440" width="96" height="130" rx="8" fill="#1e3d32" fill-opacity="0.82"/>
  <rect x="352" y="440" width="96" height="130" rx="8" fill="none" stroke="#c4a574" stroke-opacity="0.5" stroke-width="3"/>
  <g stroke="#c4a574" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round">
    <line x1="370" y1="482" x2="430" y2="482"/>
    <line x1="370" y1="508" x2="414" y2="508"/>
    <line x1="370" y1="534" x2="424" y2="534"/>
  </g>

  <rect x="378" y="318" width="44" height="16" rx="6" fill="#3d2914" fill-opacity="0.85"/>

  <text x="400" y="920" fill="#9a9288" font-family="system-ui,sans-serif" font-size="21"
        font-weight="600" letter-spacing="2" text-anchor="middle">PRO TENNIS BAT</text>
  <text x="400" y="952" fill="#9a9288" fill-opacity="0.7" font-family="system-ui,sans-serif"
        font-size="15" letter-spacing="1.5" text-anchor="middle">PHOTO PLACEHOLDER</text>
</svg>
