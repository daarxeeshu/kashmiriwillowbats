<!--
  PLACEHOLDER — awaiting real product photography.
  Same construction as english-willow-grade-1-plus.svg with fewer grains and a band of
  red wood along one edge. Replace with the real photograph at the same path.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="halo" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#e7dcc2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e7dcc2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8a279"/>
      <stop offset="42%" stop-color="#e9dec6"/>
      <stop offset="70%" stop-color="#d3c39d"/>
      <stop offset="100%" stop-color="#a08b62"/>
    </linearGradient>
    <linearGradient id="redwood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a4703f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a4703f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241a0e"/>
      <stop offset="45%" stop-color="#4a3620"/>
      <stop offset="100%" stop-color="#1d1509"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="520" rx="215" ry="400" fill="url(#halo)"/>

  <rect x="376" y="92" width="48" height="236" rx="24" fill="url(#grip)"/>
  <g stroke="#000" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round">
    <line x1="382" y1="142" x2="418" y2="142"/>
    <line x1="382" y1="182" x2="418" y2="182"/>
    <line x1="382" y1="222" x2="418" y2="222"/>
    <line x1="382" y1="262" x2="418" y2="262"/>
  </g>

  <path d="M424 322 Q452 342 457 404 C462 542 460 700 450 818 Q400 854 350 818 C340 700 338 542 343 404 Q348 342 376 322 Z"
        fill="url(#wood)"/>

  <!-- red wood along the off side -->
  <path d="M343 404 C338 542 340 700 350 818 Q368 828 382 832 C372 700 370 542 374 400 Z"
        fill="url(#redwood)"/>

  <g stroke="#9b8459" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M366 370 C364 520 364 700 367 827"/>
    <path d="M383 363 C382 520 382 700 384 831"/>
    <path d="M400 359 C400 520 400 700 400 834"/>
    <path d="M417 362 C418 520 418 700 416 832"/>
    <path d="M434 367 C435 520 435 700 433 829"/>
    <path d="M447 375 C449 520 449 700 446 825"/>
  </g>

  <path d="M343 404 C338 542 340 700 350 818 Q368 830 384 834 C374 700 372 542 376 400 Z"
        fill="#000" fill-opacity="0.1"/>
  <path d="M457 404 C462 542 460 700 450 818 Q432 830 416 834 C426 700 428 542 424 400 Z"
        fill="#000" fill-opacity="0.16"/>
  <rect x="378" y="318" width="44" height="16" rx="6" fill="#3d2914" fill-opacity="0.85"/>

  <text x="400" y="920" fill="#9a9288" font-family="system-ui,sans-serif" font-size="21"
        font-weight="600" letter-spacing="2" text-anchor="middle">GRADE 3</text>
  <text x="400" y="952" fill="#9a9288" fill-opacity="0.7" font-family="system-ui,sans-serif"
        font-size="15" letter-spacing="1.5" text-anchor="middle">PHOTO PLACEHOLDER</text>
</svg>
