<!--
  PLACEHOLDER — awaiting real product photography.
  Same construction as regular-bat.svg with a dark blade, which is only there to make
  this card distinguishable from its three neighbours while the layout is reviewed —
  not a statement about the finish. Replace with the real photograph at the same path.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="halo" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="42%" stop-color="#3a3530"/>
      <stop offset="70%" stop-color="#262220"/>
      <stop offset="100%" stop-color="#0d0c0b"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241a0e"/>
      <stop offset="45%" stop-color="#4a3620"/>
      <stop offset="100%" stop-color="#1d1509"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="520" rx="215" ry="400" fill="url(#halo)"/>

  <rect x="376" y="92" width="48" height="236" rx="24" fill="url(#grip)"/>
  <g stroke="#000" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round">
    <line x1="382" y1="142" x2="418" y2="142"/>
    <line x1="382" y1="182" x2="418" y2="182"/>
    <line x1="382" y1="222" x2="418" y2="222"/>
    <line x1="382" y1="262" x2="418" y2="262"/>
  </g>

  <path d="M424 322 Q452 342 457 404 C462 542 460 700 450 818 Q400 854 350 818 C340 700 338 542 343 404 Q348 342 376 322 Z"
        fill="url(#blade)"/>
  <!-- a lit hairline down the spine, because a dark blade with no highlight reads as a
       hole in the card rather than an object -->
  <path d="M400 344 C404 520 404 700 400 838" stroke="#fff" stroke-opacity="0.13" stroke-width="6" fill="none"/>

  <!-- chevrons, purely to separate this placeholder from the other three -->
  <g stroke="#c4a574" stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M362 470 L400 508 L438 470"/>
    <path d="M362 540 L400 578 L438 540"/>
    <path d="M362 610 L400 648 L438 610"/>
  </g>

  <rect x="378" y="318" width="44" height="16" rx="6" fill="#3d2914" fill-opacity="0.85"/>

  <text x="400" y="920" fill="#9a9288" font-family="system-ui,sans-serif" font-size="21"
        font-weight="600" letter-spacing="2" text-anchor="middle">BLACK MAMBA</text>
  <text x="400" y="952" fill="#9a9288" fill-opacity="0.7" font-family="system-ui,sans-serif"
        font-size="15" letter-spacing="1.5" text-anchor="middle">PHOTO PLACEHOLDER</text>
</svg>
